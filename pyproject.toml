[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engrix-router"
version = "0.1.0"
description = "Local OpenAI/Anthropic-compatible API gateway: multi-account routing, connection health, budget, vendor quota, proxy pool, per-request trace."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Engrix" }]
keywords = ["gateway", "llm", "openai", "anthropic", "router"]

# Dependensi inti didefinisikan DI SINI (satu tempat). requirements.txt cuma
# `-e .[dev]` supaya gak ada dua sumber kebenaran versi.
# Terverifikasi di lingkungan owner (Python 3.12.9):
# fastapi 0.142.2 | uvicorn 0.54.0 | pydantic 2.13.5 | httpx 0.28.1
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "import-linter>=2.0",
  "ruff>=0.6",
  "pre-commit>=3.7",
]

[project.scripts]
engrix-router = "engrix_router.web.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engrix_router = [
  "schema.sql",
  "web/templates/*.html",
  "web/static/*.css",
  "web/static/assets/*",
  # label operator ikut ter-bundle (ADR-0000): tanpa dua file ini dashboard.py
  # raise saat import di instalasi wheel.
  "web/strings/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Suite kontrak pakai `async def test_*`; tanpa auto mode tes-nya ke-skip senyap.
asyncio_mode = "auto"

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["**/__pycache__", ".venv", "data"]
typeCheckingMode = "basic"
extraPaths = ["src"]
reportMissingImports = "warning"

[tool.ruff]
line-length = 110
target-version = "py311"
